<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore services — TaskLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-nav>
<main>
  <div class="seg"><a href="services.html" class="on">Services</a><a href="missions.html">Do both</a></div>
  <header class="page-heading cover">
    <h1>Find a service</h1>
    <p>Search local skills, services and practical training.</p>
  </header>
  <form class="search-panel" id="searchForm">
    <input id="q" placeholder="Ex: logo, how to save money..." aria-label="Search services">
    <select id="category" aria-label="Category"><option value="">All categories</option><option value="Design">Design</option><option value="IT">IT</option><option value="Education">Education</option><option value="Sewing">Sewing</option><option value="Photo">Photo</option><option value="Beauty">Beauty</option><option value="Repair">Repair</option><option value="Finance">Finance</option><option value="Business">Business</option><option value="Content">Content</option><option value="Coaching">Coaching</option></select>
    <button type="submit" id="search">Search</button>
  </form>
  <div id="list"></div>

  <section id="offer">
    <div class="sec-head"><h2>Offer your skills</h2></div>
    <form id="add" class="card">
      <label>Service or training name<input name="title" required maxlength="120" placeholder="e.g. Logo design"></label>
      <label>Category<select name="category" required><option value="Design">Design</option><option value="IT">IT</option><option value="Education">Education</option><option value="Sewing">Sewing</option><option value="Photo">Photo</option><option value="Beauty">Beauty</option><option value="Repair">Repair</option><option value="Finance">Finance</option><option value="Business">Business</option><option value="Content">Content</option><option value="Coaching">Coaching</option></select></label>
      <label>Type<select name="kind"><option value="service">Service</option><option value="training">Training</option></select></label>
      <label>Description<textarea name="description" required maxlength="2000" placeholder="Describe what you offer"></textarea></label>
      <label>Starting price (FCFA)<input type="number" name="price" min="0" step="1" inputmode="numeric" required></label>
      <p id="addMsg" class="msg" role="alert"></p>
      <button class="green" type="submit"><span aria-hidden="true">＋</span> Add service</button>
    </form>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/services.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create an account — TaskLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-wrap">
  <a class="auth-brand" href="index.html"><span>T</span> TaskLink</a>
  <section class="auth-panel">
    <h1>Create your account</h1>
    <p>Join a community where skills turn into opportunities.</p>
    <form id="form" data-url="/api/register" data-next="home.html">
      <label>Full name<input name="full_name" autocomplete="name" placeholder="Your full name" minlength="2" maxlength="80" pattern="\p{L}+(?:[ '’.\-]{1,2}\p{L}+)*\.?" title="Letters only (accents, space, hyphen and apostrophe allowed)" required></label>
      <label>Phone number<input type="tel" name="phone" autocomplete="tel" placeholder="+237 6XX XXX XXX" maxlength="25" pattern="[+0-9 \(\)\.\-]{9,25}" title="Example: +237 677 12 34 56" required></label>
      <label>Email address<input type="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" maxlength="120" pattern="(?!.*\.\.)[a-z](?:[a-z0-9._%+\-]*[a-z0-9])?@(?:[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}" title="Example: name@example.com (lowercase only, must start with a letter, no double dots)" required></label>
      <label>City
        <select name="city" required>
          <option value="Yaoundé">Yaoundé</option>
          <option value="Douala">Douala</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label>Password<input type="password" name="password" minlength="8" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,128}" title="At least 8 characters, with a letter and a digit" autocomplete="new-password" placeholder="At least 8 characters, with a letter and a digit" required></label>
      <p class="msg" id="msg" role="alert"></p>
      <button type="submit">Create my account <span aria-hidden="true">→</span></button>
    </form>
    <p class="subtle">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create an account — TaskLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-wrap">
  <a class="auth-brand" href="index.html"><span>T</span> TaskLink</a>
  <section class="auth-panel">
    <h1>Create your account</h1>
    <p>Join a community where skills turn into opportunities.</p>
    <form id="form" data-url="/api/register" data-next="home.html">
      <label>Full name<input name="full_name" autocomplete="name" placeholder="Your full name" maxlength="80" required></label>
      <label>Phone number<input type="tel" name="phone" autocomplete="tel" placeholder="+237 6XX XXX XXX" maxlength="25" required></label>
      <label>Email address<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label>City
        <select name="city" required>
          <option value="Yaoundé">Yaoundé</option>
          <option value="Douala">Douala</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label>Password<input type="password" name="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="At least 6 characters" required></label>
      <p class="msg" id="msg" role="alert"></p>
      <button type="submit">Create my account <span aria-hidden="true">→</span></button>
    </form>
    <p class="subtle">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

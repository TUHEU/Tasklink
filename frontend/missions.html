<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missions — TaskLink</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-nav>
<main>
  <div class="seg"><a href="services.html">Services</a><a href="missions.html" class="on">Do both</a></div>
  <header class="page-heading">
    <h1>Services and missions</h1>
    <p>Discover opportunities, apply to missions, or post a task you need help with.</p>
  </header>
  <form class="search-panel" id="searchForm" style="grid-template-columns:1fr auto">
    <input id="q" placeholder="Search services or missions..." aria-label="Search services or missions">
    <button type="submit" id="search">Search</button>
  </form>

  <div class="sec-head"><h2>Services and trainings</h2><a class="link" href="services.html#offer">Offer a service <span aria-hidden="true">→</span></a></div>
  <div id="svc"></div>

  <div class="sec-head"><h2>Open missions</h2></div>
  <div id="list"></div>

  <div class="sec-head"><h2>Post a mission</h2></div>
  <form id="add" class="card">
    <label>Mission title<input name="title" required maxlength="120" placeholder="What do you need done?"></label>
    <label>Description<textarea name="description" required maxlength="2000" placeholder="Give the details and expectations"></textarea></label>
    <label>Budget (FCFA)<input type="number" name="budget" min="0" step="1" inputmode="numeric" required></label>
    <p class="msg" id="addMsg" role="alert"></p>
    <button class="orange" type="submit"><span aria-hidden="true">＋</span> Post mission</button>
  </form>

  <div class="sec-head"><h2>My missions</h2></div>
  <div id="mine"></div>
</main>
<script src="js/app.js"></script>
<script src="js/both.js"></script>
</body>
</html>
